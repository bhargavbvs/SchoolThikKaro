<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>shaala</title>
  <script>
    // Applies a remembered theme choice before the stylesheet paints, so a
    // returning visitor never sees a flash of the wrong theme. Deliberately
    // not importing src/lib/theme.js here — this must run as plain,
    // synchronous, blocking script, before any module graph resolves.
    (function () {
      var t = localStorage.getItem('shaala.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="map"></div>
  <header id="topbar"></header>
  <aside id="sheet" hidden></aside>
  <div id="submit-root" hidden></div>
  <div id="admin-root" hidden></div>
  <div id="toast" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
